<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AmazeUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <!-- APlayer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <style>
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse"></div>
    </div>

    <div class="relative z-10 max-w-4xl mx-auto px-4 py-8">
        <!-- 头部 -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center gap-3 mb-3">
                <span class="text-5xl">🎵</span>
                <h1 class="text-4xl font-bold text-white tracking-tight">Music</h1>
            </div>
            <p class="text-gray-400 text-sm">免费音乐搜索 · 在线播放 · 一键下载</p>
        </header>

        <!-- 搜索区域 -->
        <section id="searchSection" class="mb-8">
            <div class="max-w-xl mx-auto">
                <div class="relative">
                    <input 
                        id="searchInput"
                        type="text" 
                        placeholder="搜索歌曲、歌手、专辑..."
                        class="w-full px-6 py-4 bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl text-white placeholder-gray-400 focus:outline-none focus:border-white/40 focus:bg-white/15 transition-all text-lg"
                    >
                    <button 
                        id="searchBtn"
                        onclick="searchMusic()"
                        class="absolute right-2 top-1/2 -translate-y-1/2 px-6 py-2.5 bg-white text-purple-600 rounded-xl font-semibold hover:bg-gray-100 transition-all"
                    >
                        搜索
                    </button>
                </div>
            </div>
        </section>

        <!-- 结果区域 -->
        <section id="playerSection" class="hidden">
            <!-- 返回按钮 -->
            <button 
                onclick="backToSearch()"
                class="mb-5 px-4 py-2 bg-white/10 hover:bg-white/20 backdrop-blur-sm rounded-lg text-gray-300 text-sm transition-all inline-flex items-center gap-2 border border-white/10"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                返回搜索
            </button>

            <!-- j-main 保持原样式 -->
            <form id="j-main" class="am-form music-main music-panel result-panel">
                <div class="result-grid">
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                        <input id="j-link" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                        <input id="j-src" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                        <input id="j-songid" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                        <input id="j-lrc" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                        <input id="j-name" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                        <input id="j-author" class="am-form-field" readonly>
                    </div>
                </div>
                <div class="player-wrap">
                    <div id="j-player" class="aplayer"></div>
                </div>
            </form>

            <!-- 载入更多 -->
            <button 
                id="loadMoreBtn"
                onclick="loadMore()"
                class="hidden w-full mt-4 py-3 bg-white/10 hover:bg-white/20 backdrop-blur-sm rounded-xl text-gray-300 font-medium transition-all border border-white/10"
            >
                载入更多
            </button>
        </section>

        <!-- 底部 -->
        <footer class="text-center py-8 text-gray-500 text-xs">
            <p>仅供学习交流使用，请支持正版音乐</p>
        </footer>
    </div>

    <!-- 提示信息 -->
    <div id="notice" class="hidden"></div>

    <!-- jQuery (APlayer需要) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <!-- APlayer -->
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <!-- App Script -->
    <script src="script.js"></script>
</body>
</html>
