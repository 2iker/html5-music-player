<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body class="bg-gradient-to-b from-purple-900 via-indigo-900 to-slate-900 min-h-screen text-white">
    <!-- 手机框架 -->
    <div class="max-w-md mx-auto min-h-screen bg-black/30 backdrop-blur-xl">
        <!-- 状态栏 -->
        <div class="flex items-center justify-between px-6 py-3 text-xs text-white/60">
            <span>9:41</span>
            <div class="flex items-center gap-2">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 16 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33v-15.34C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- 头部 -->
        <div class="px-6 pb-4">
            <h1 class="text-2xl font-bold mb-1">音乐搜索</h1>
            <p class="text-white/50 text-sm">发现更多好音乐</p>
        </div>

        <!-- 搜索框 -->
        <div class="px-6 mb-6">
            <div class="relative">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input 
                    id="searchInput"
                    type="text" 
                    placeholder="搜索歌曲、歌手..."
                    class="w-full pl-12 pr-4 py-3.5 bg-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:bg-white/15 transition-all text-base"
                >
            </div>
        </div>

        <!-- 快捷标签 -->
        <div class="px-6 mb-6 flex gap-2 overflow-x-auto pb-2">
            <span class="px-4 py-2 bg-white/20 rounded-full text-sm whitespace-nowrap cursor-pointer hover:bg-white/30 transition-all">周杰伦</span>
            <span class="px-4 py-2 bg-white/20 rounded-full text-sm whitespace-nowrap cursor-pointer hover:bg-white/30 transition-all">林俊杰</span>
            <span class="px-4 py-2 bg-white/20 rounded-full text-sm whitespace-nowrap cursor-pointer hover:bg-white/30 transition-all">陈奕迅</span>
            <span class="px-4 py-2 bg-white/20 rounded-full text-sm whitespace-nowrap cursor-pointer hover:bg-white/30 transition-all">薛之谦</span>
            <span class="px-4 py-2 bg-white/20 rounded-full text-sm whitespace-nowrap cursor-pointer hover:bg-white/30 transition-all">邓紫棋</span>
        </div>

        <!-- 搜索按钮 -->
        <div class="px-6 mb-6">
            <button 
                id="searchBtn"
                onclick="searchMusic()"
                class="w-full py-3.5 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl text-white font-semibold text-base shadow-lg shadow-purple-500/25 active:scale-98 transition-all"
            >
                搜索
            </button>
        </div>

        <!-- 结果区域 -->
        <div id="playerSection" class="hidden px-6">
            <!-- 返回 -->
            <button onclick="backToSearch()" class="mb-4 text-white/50 text-sm flex items-center gap-1">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                返回
            </button>

            <!-- j-main 保持原样式 -->
            <form id="j-main" class="am-form music-main music-panel result-panel">
                <div class="result-grid">
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                        <input id="j-link" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                        <input id="j-src" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                        <input id="j-songid" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                        <input id="j-lrc" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                        <input id="j-name" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                        <input id="j-author" class="am-form-field" readonly>
                    </div>
                </div>
                <div class="player-wrap">
                    <div id="j-player" class="aplayer"></div>
                </div>
            </form>

            <!-- 载入更多 -->
            <button 
                id="loadMoreBtn"
                onclick="loadMore()"
                class="hidden w-full mt-4 py-3 bg-white/10 rounded-xl text-white/70 text-sm font-medium transition-all"
            >
                载入更多
            </button>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-black/80 backdrop-blur-xl border-t border-white/10 px-6 py-4">
            <div class="flex items-center justify-around">
                <div class="flex flex-col items-center gap-1 text-white">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span class="text-xs">首页</span>
                </div>
                <div class="flex flex-col items-center gap-1 text-white/40">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <span class="text-xs">搜索</span>
                </div>
                <div class="flex flex-col items-center gap-1 text-white/40">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <span class="text-xs">歌单</span>
                </div>
                <div class="flex flex-col items-center gap-1 text-white/40">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="text-xs">我的</span>
                </div>
            </div>
        </div>
    </div>

    <div id="notice" class="hidden"></div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
