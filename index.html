<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Music</span>
            </div>
            <p class="tagline">免费音乐搜索 · 在线播放 · 一键下载</p>
        </header>

        <!-- 搜索区域 -->
        <section id="searchSection" class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索歌曲、歌手、专辑...">
                <button id="searchBtn" onclick="searchMusic()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
        </section>

        <!-- 播放器区域 -->
        <section id="playerSection" class="player-section hidden">
            <button onclick="backToSearch()" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
                返回搜索
            </button>

            <!-- result-grid -->
            <div class="result-grid">
                <div class="am-input-group am-input-group-sm result-field">
                    <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                    <input id="j-link" class="am-form-field" readonly>
                    <span class="am-input-group-btn">
                        <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                    </span>
                </div>
                <div class="am-input-group am-input-group-sm result-field">
                    <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                    <input id="j-src" class="am-form-field" readonly>
                    <span class="am-input-group-btn">
                        <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer" title="在新窗口打开音乐链接"><i class="am-icon-download"></i></a>
                    </span>
                </div>
                <div class="am-input-group am-input-group-sm result-field">
                    <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                    <input id="j-songid" class="am-form-field" readonly>
                </div>
                <div class="am-input-group am-input-group-sm result-field">
                    <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                    <input id="j-lrc" class="am-form-field" readonly>
                    <span class="am-input-group-btn">
                        <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                    </span>
                </div>
                <div class="am-input-group am-input-group-sm result-field">
                    <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                    <input id="j-name" class="am-form-field" readonly>
                </div>
                <div class="am-input-group am-input-group-sm result-field">
                    <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                    <input id="j-author" class="am-form-field" readonly>
                </div>
            </div>

            <!-- APlayer -->
            <div id="aplayer"></div>

            <!-- 载入更多 -->
            <button id="loadMoreBtn" class="btn-load-more" onclick="loadMore()">
                <span>载入更多</span>
            </button>

            <!-- 提示信息 -->
            <div id="notice" class="notice hidden"></div>
        </section>

        <!-- 底部信息 -->
        <footer class="footer">
            <p>仅供学习交流使用，请支持正版音乐</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
