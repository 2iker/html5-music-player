<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Music</span>
            </div>
            <p class="tagline">免费音乐搜索 · 在线播放 · 一键下载</p>
        </header>

        <!-- 搜索区域 -->
        <section id="searchSection" class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索歌曲、歌手、专辑...">
                <button id="searchBtn" onclick="searchMusic()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
            <div class="platform-tags">
                <span class="tag active" data-platform="netease">网易云</span>
            </div>
        </section>

        <!-- 播放器区域 -->
        <section id="playerSection" class="player-section hidden">
            <div class="song-info-card">
                <div class="song-details">
                    <h2 id="songTitle">-</h2>
                    <p id="songArtist">-</p>
                </div>
                <div class="song-meta">
                    <div class="meta-item">
                        <span class="meta-label">ID</span>
                        <span id="songId" class="meta-value">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">链接</span>
                        <a id="songLink" href="#" target="_blank" class="meta-link">查看</a>
                    </div>
                </div>
                <div class="song-actions">
                    <button onclick="copyUrl(document.getElementById('songUrl').value)" class="btn-action">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        复制链接
                    </button>
                    <a id="downloadBtn" href="#" download class="btn-action btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        下载
                    </a>
                </div>
                <input type="hidden" id="songUrl">
            </div>

            <!-- APlayer -->
            <div id="aplayer"></div>

            <!-- 载入更多 -->
            <button id="loadMoreBtn" class="btn-load-more" onclick="loadMore()">
                <span>载入更多</span>
            </button>

            <!-- 提示信息 -->
            <div id="notice" class="notice hidden"></div>
        </section>

        <!-- 歌曲列表 -->
        <section id="listSection" class="list-section hidden">
            <div class="list-header">
                <h3>搜索结果</h3>
                <button onclick="backToSearch()" class="btn-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                    返回搜索
                </button>
            </div>
            <div id="songList" class="song-list"></div>
        </section>

        <!-- 底部信息 -->
        <footer class="footer">
            <p>仅供学习交流使用，请支持正版音乐</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
