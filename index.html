<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css?v=44">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b8def' stroke-width='2'%3E%3Cpath d='M9 18V5l12-2v13'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Ccircle cx='18' cy='16' r='3'/%3E%3C/svg%3E">
</head>
<body>
    <div class="wave-bg">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    <div class="landing">
        <div class="logo-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
        </div>
        <h1>Music</h1>
        <p class="subtitle">HTML5 music player</p>

        <!-- 结果区域 -->
        <div id="playerSection" class="player-section">
            <!-- 搜索框 -->
            <div class="search-wrap">
                <input 
                    id="searchInput2"
                    type="text" 
                    placeholder="搜索歌曲、歌手、专辑..."
                    class="search-input"
                >
                <button 
                    id="searchBtn2"
                    onclick="searchMusic2()"
                    class="search-btn"
                    aria-label="搜索"
                >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>

            <a id="githubLink" class="github-link" href="https://github.com/2iker/html5-music-player" target="_blank" rel="noreferrer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.082-.73.082-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.124-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.118 3.176.77.84 1.234 1.91 1.234 3.22 0 4.61-2.807 5.625-5.48 5.92.43.372.824 1.102.824 2.222 0 1.606-.015 2.898-.015 3.293 0 .322.216.694.825.576C20.565 21.795 24 17.3 24 12 24 5.37 18.63 0 12 0z"/></svg>
                <span>GitHub</span>
            </a>

            <!-- j-main 保持原样式 -->
            <form id="j-main" class="am-form music-main music-panel result-panel hidden">
                <div class="result-grid">
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                        <input id="j-link" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-link-btn" class="am-btn am-btn-default" target="_blank" aria-label="打开歌曲链接"><i class="am-icon-external-link"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                        <input id="j-src" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer" aria-label="下载音频"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                        <input id="j-songid" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                        <input id="j-lrc" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank" aria-label="下载歌词"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                        <input id="j-name" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                        <input id="j-author" class="am-form-field" readonly>
                    </div>
                </div>
                <div class="player-wrap">
                    <div id="j-player" class="aplayer"></div>
                </div>
            </form>

            <button 
                id="loadMoreBtn"
                onclick="loadMore()"
                class="load-more-btn hidden"
            >
                载入更多
            </button>
        </div>
    </div>

    <div id="notice" class="hidden"></div>
    <footer class="site-footer">
        <p>© 2026 2iker · 免费音乐搜索 · 仅供个人学习使用，版权归原作者所有</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
