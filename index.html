<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Music</span>
            </div>
            <p class="tagline">免费音乐搜索 · 在线播放 · 一键下载</p>
        </header>

        <!-- 搜索区域 -->
        <section id="j-validator" class="search-section">
            <div class="search-box">
                <input type="text" id="j-input" placeholder="搜索歌曲、歌手、专辑...">
                <button id="j-submit" onclick="searchMusic()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
        </section>

        <!-- 播放器区域 -->
        <form id="j-main" class="am-form music-main music-panel result-panel" style="display:none;">
            <a type="button" id="j-back" class="am-btn am-btn-success am-btn-lg am-btn-block am-radius music-back" onclick="backToSearch()">
                <i class="am-icon-reply am-icon-fw"></i>
                返回搜索
            </a>
            <div class="result-grid">
                <div class="am-input-group am-input-group-sm result-field" data-am-popover="{content: '音乐地址', trigger: 'hover'}">
                    <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                    <input id="j-link" class="am-form-field" readonly>
                    <span class="am-input-group-btn">
                        <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                    </span>
                </div>
                <div class="am-input-group am-input-group-sm result-field" data-am-popover="{content: '音乐链接', trigger: 'hover'}">
                    <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                    <input id="j-src" class="am-form-field" readonly>
                    <span class="am-input-group-btn">
                        <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer" title="在新窗口打开音乐链接"><i class="am-icon-download"></i></a>
                    </span>
                </div>
                <div class="am-input-group am-input-group-sm result-field" data-am-popover="{content: '音乐ID', trigger: 'hover'}">
                    <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                    <input id="j-songid" class="am-form-field" readonly>
                </div>
                <div class="am-input-group am-input-group-sm result-field" data-am-popover="{content: '音乐歌词', trigger: 'hover'}">
                    <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                    <input id="j-lrc" class="am-form-field" readonly>
                    <span class="am-input-group-btn">
                        <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                    </span>
                </div>
                <div class="am-input-group am-input-group-sm result-field" data-am-popover="{content: '音乐名称', trigger: 'hover'}">
                    <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                    <input id="j-name" class="am-form-field" readonly>
                </div>
                <div class="am-input-group am-input-group-sm result-field" data-am-popover="{content: '音乐作者', trigger: 'hover'}">
                    <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                    <input id="j-author" class="am-form-field" readonly>
                </div>
            </div>
            <div id="j-show" class="player-wrap">
                <div id="j-player" class="aplayer"></div>
            </div>
        </form>

        <!-- 底部信息 -->
        <footer class="footer">
            <p>仅供学习交流使用，请支持正版音乐</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
