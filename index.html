<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body class="bg-stone-950 min-h-screen">
    <div class="max-w-6xl mx-auto px-8 py-16">
        <!-- 头部 -->
        <header class="text-center mb-16">
            <div class="inline-flex items-center gap-3 mb-4">
                <div class="w-px h-8 bg-gradient-to-b from-transparent via-amber-500 to-transparent"></div>
                <span class="text-amber-500 text-sm tracking-[0.3em] uppercase font-medium">Premium</span>
                <div class="w-px h-8 bg-gradient-to-b from-transparent via-amber-500 to-transparent"></div>
            </div>
            <h1 class="text-5xl font-bold text-white mb-3 tracking-tight" style="font-family: 'Playfair Display', serif;">Music</h1>
            <p class="text-stone-400 text-sm tracking-wide">免费音乐搜索 · 在线播放 · 一键下载</p>
        </header>

        <!-- 搜索区域 -->
        <section id="searchSection" class="mb-14">
            <div class="max-w-2xl mx-auto">
                <div class="relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-amber-500/20 to-amber-600/20 rounded-2xl blur opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div class="relative bg-stone-900 border border-stone-800 rounded-2xl p-2 flex items-center">
                        <input 
                            id="searchInput"
                            type="text" 
                            placeholder="搜索歌曲、歌手、专辑..."
                            class="flex-1 px-6 py-4 bg-transparent text-white text-lg placeholder-stone-500 focus:outline-none"
                        >
                        <button 
                            id="searchBtn"
                            onclick="searchMusic()"
                            class="px-8 py-4 bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 rounded-xl font-medium transition-all border border-amber-500/30"
                        >
                            搜索
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 结果区域 -->
        <section id="playerSection" class="hidden">
            <button 
                onclick="backToSearch()"
                class="mb-8 px-4 py-2 text-stone-500 hover:text-stone-300 transition-colors inline-flex items-center gap-2 text-sm"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                返回
            </button>

            <!-- j-main 保持原样式 -->
            <form id="j-main" class="am-form music-main music-panel result-panel">
                <div class="result-grid">
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                        <input id="j-link" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                        <input id="j-src" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                        <input id="j-songid" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                        <input id="j-lrc" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                        <input id="j-name" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                        <input id="j-author" class="am-form-field" readonly>
                    </div>
                </div>
                <div class="player-wrap">
                    <div id="j-player" class="aplayer"></div>
                </div>
            </form>

            <button 
                id="loadMoreBtn"
                onclick="loadMore()"
                class="hidden w-full mt-6 py-4 bg-stone-900 hover:bg-stone-800 border border-stone-800 rounded-xl text-stone-400 font-medium transition-all"
            >
                载入更多
            </button>
        </section>

        <footer class="text-center py-12 text-stone-600 text-xs tracking-wide">
            <div class="inline-flex items-center gap-4">
                <div class="w-12 h-px bg-stone-800"></div>
                <p>仅供学习交流使用，请支持正版音乐</p>
                <div class="w-12 h-px bg-stone-800"></div>
            </div>
        </footer>
    </div>

    <div id="notice" class="hidden"></div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
