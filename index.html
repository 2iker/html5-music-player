<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AmazeUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <!-- APlayer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body class="bg-zinc-900 text-white min-h-screen">
    <div class="max-w-6xl mx-auto px-8 py-10">
        <!-- 头部 -->
        <header class="mb-12">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-emerald-500 rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/20">
                    <span class="text-3xl">🎵</span>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">Music</h1>
                    <p class="text-zinc-400 text-sm mt-0.5">免费音乐搜索 · 在线播放 · 一键下载</p>
                </div>
            </div>
        </header>

        <!-- 搜索区域 -->
        <section id="searchSection" class="mb-10">
            <div class="relative">
                <input 
                    id="searchInput"
                    type="text" 
                    placeholder="搜索歌曲、歌手、专辑..."
                    class="w-full px-6 py-4 bg-zinc-800 border border-zinc-700 rounded-xl text-white text-lg placeholder-zinc-500 focus:outline-none focus:border-zinc-500 focus:bg-zinc-800/80 transition-all"
                >
                <button 
                    id="searchBtn"
                    onclick="searchMusic()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 px-5 py-2 bg-white text-black rounded-full font-semibold text-sm hover:scale-105 transition-transform"
                >
                    搜索
                </button>
            </div>
        </section>

        <!-- 结果区域 -->
        <section id="playerSection" class="hidden">
            <!-- 返回按钮 -->
            <button 
                onclick="backToSearch()"
                class="mb-6 flex items-center gap-2 text-zinc-400 hover:text-white transition-colors"
            >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                返回
            </button>

            <!-- j-main 保持原样式 -->
            <form id="j-main" class="am-form music-main music-panel result-panel">
                <div class="result-grid">
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                        <input id="j-link" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                        <input id="j-src" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                        <input id="j-songid" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                        <input id="j-lrc" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                        <input id="j-name" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                        <input id="j-author" class="am-form-field" readonly>
                    </div>
                </div>
                <div class="player-wrap">
                    <div id="j-player" class="aplayer"></div>
                </div>
            </form>

            <!-- 载入更多 -->
            <button 
                id="loadMoreBtn"
                onclick="loadMore()"
                class="hidden w-full mt-6 py-3.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-zinc-300 font-medium transition-all"
            >
                载入更多
            </button>
        </section>

        <!-- 底部 -->
        <footer class="text-center py-8 text-zinc-500 text-xs border-t border-zinc-800 mt-16">
            <p>仅供学习交流使用，请支持正版音乐</p>
        </footer>
    </div>

    <!-- 提示信息 -->
    <div id="notice" class="hidden"></div>

    <!-- jQuery (APlayer需要) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <!-- APlayer -->
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
