<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AmazeUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <!-- APlayer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800">
        <div class="container mx-auto px-6 py-12 max-w-5xl">
            <!-- 头部 -->
            <header class="text-center mb-12">
                <div class="inline-flex items-center gap-4 mb-4">
                    <span class="text-6xl">🎵</span>
                    <h1 class="text-5xl font-bold text-white">Music</h1>
                </div>
                <p class="text-xl text-white/70">免费音乐搜索 · 在线播放 · 一键下载</p>
            </header>

            <!-- 搜索区域 -->
            <section id="searchSection" class="mb-12">
                <div class="max-w-2xl mx-auto">
                    <div class="bg-white/10 backdrop-blur-xl rounded-2xl p-2 border border-white/20">
                        <div class="flex">
                            <input 
                                id="searchInput"
                                type="text" 
                                placeholder="搜索歌曲、歌手、专辑..."
                                class="flex-1 px-6 py-4 bg-transparent text-white text-lg placeholder-white/50 focus:outline-none"
                            >
                            <button 
                                id="searchBtn"
                                onclick="searchMusic()"
                                class="px-8 py-4 bg-white text-purple-600 rounded-xl font-bold text-lg hover:bg-gray-100 transition-all"
                            >
                                搜索
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 结果区域 -->
            <section id="playerSection" class="hidden">
                <!-- 返回按钮 -->
                <button 
                    onclick="backToSearch()"
                    class="mb-6 px-5 py-2.5 bg-white/10 hover:bg-white/20 backdrop-blur-sm rounded-xl text-white/80 text-base transition-all inline-flex items-center gap-2"
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                    返回搜索
                </button>

                <!-- j-main 保持原样式 -->
                <form id="j-main" class="am-form music-main music-panel result-panel">
                    <div class="result-grid">
                        <div class="am-input-group am-input-group-sm result-field">
                            <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                            <input id="j-link" class="am-form-field" readonly>
                            <span class="am-input-group-btn">
                                <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                            </span>
                        </div>
                        <div class="am-input-group am-input-group-sm result-field">
                            <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                            <input id="j-src" class="am-form-field" readonly>
                            <span class="am-input-group-btn">
                                <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer"><i class="am-icon-download"></i></a>
                            </span>
                        </div>
                        <div class="am-input-group am-input-group-sm result-field">
                            <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                            <input id="j-songid" class="am-form-field" readonly>
                        </div>
                        <div class="am-input-group am-input-group-sm result-field">
                            <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                            <input id="j-lrc" class="am-form-field" readonly>
                            <span class="am-input-group-btn">
                                <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                            </span>
                        </div>
                        <div class="am-input-group am-input-group-sm result-field">
                            <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                            <input id="j-name" class="am-form-field" readonly>
                        </div>
                        <div class="am-input-group am-input-group-sm result-field">
                            <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                            <input id="j-author" class="am-form-field" readonly>
                        </div>
                    </div>
                    <div class="player-wrap">
                        <div id="j-player" class="aplayer"></div>
                    </div>
                </form>

                <!-- 载入更多 -->
                <button 
                    id="loadMoreBtn"
                    onclick="loadMore()"
                    class="hidden w-full mt-6 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-sm rounded-xl text-white/80 font-medium transition-all text-base"
                >
                    载入更多
                </button>
            </section>

            <!-- 底部 -->
            <footer class="text-center py-10 text-white/40 text-sm">
                <p>仅供学习交流使用，请支持正版音乐</p>
            </footer>
        </div>
    </div>

    <!-- 提示信息 -->
    <div id="notice" class="hidden"></div>

    <!-- jQuery (APlayer需要) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <!-- APlayer -->
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
