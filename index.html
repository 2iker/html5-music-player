<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - 免费音乐搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/dist/css/amazeui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 min-h-screen">
    <div class="max-w-5xl mx-auto px-6 py-12">
        <!-- 头部 -->
        <header class="text-center mb-14">
            <div class="inline-flex items-center gap-4 bg-white/5 backdrop-blur-sm px-8 py-5 rounded-3xl border border-white/10">
                <span class="text-5xl">🎵</span>
                <div class="text-left">
                    <h1 class="text-3xl font-bold text-white tracking-tight">Music</h1>
                    <p class="text-gray-400 text-sm">免费音乐搜索 · 在线播放 · 一键下载</p>
                </div>
            </div>
        </header>

        <!-- 搜索区域 -->
        <section id="searchSection" class="mb-10">
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <input 
                        id="searchInput"
                        type="text" 
                        placeholder="搜索歌曲、歌手、专辑..."
                        class="w-full px-6 py-5 bg-white/5 border border-white/10 rounded-2xl text-white text-lg placeholder-gray-500 focus:outline-none focus:border-white/30 focus:bg-white/10 transition-all"
                    >
                    <button 
                        id="searchBtn"
                        onclick="searchMusic()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 px-7 py-3 bg-white text-gray-900 rounded-xl font-semibold text-base hover:bg-gray-100 transition-all"
                    >
                        搜索
                    </button>
                </div>
            </div>
        </section>

        <!-- 结果区域 -->
        <section id="playerSection" class="hidden">
            <button 
                onclick="backToSearch()"
                class="mb-6 px-4 py-2 text-gray-400 hover:text-white transition-colors inline-flex items-center gap-2 text-sm"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                返回搜索
            </button>

            <!-- j-main 保持原样式 -->
            <form id="j-main" class="am-form music-main music-panel result-panel">
                <div class="result-grid">
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-link am-icon-fw"></i></span>
                        <input id="j-link" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-link-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-external-link"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-music am-icon-fw"></i></span>
                        <input id="j-src" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-src-btn" class="am-btn am-btn-default" target="_blank" rel="noreferrer"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-list-ol am-icon-fw"></i></span>
                        <input id="j-songid" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-file-text-o am-icon-fw"></i></span>
                        <input id="j-lrc" class="am-form-field" readonly>
                        <span class="am-input-group-btn">
                            <a id="j-lrc-btn" class="am-btn am-btn-default" target="_blank"><i class="am-icon-download"></i></a>
                        </span>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-tag am-icon-fw"></i></span>
                        <input id="j-name" class="am-form-field" readonly>
                    </div>
                    <div class="am-input-group am-input-group-sm result-field">
                        <span class="am-input-group-label"><i class="am-icon-user am-icon-fw"></i></span>
                        <input id="j-author" class="am-form-field" readonly>
                    </div>
                </div>
                <div class="player-wrap">
                    <div id="j-player" class="aplayer"></div>
                </div>
            </form>

            <button 
                id="loadMoreBtn"
                onclick="loadMore()"
                class="hidden w-full mt-6 py-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-gray-300 font-medium transition-all"
            >
                载入更多
            </button>
        </section>

        <footer class="text-center py-10 text-gray-500 text-xs">
            <p>仅供学习交流使用，请支持正版音乐</p>
        </footer>
    </div>

    <div id="notice" class="hidden"></div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
